{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Notifications</h1>
    <div class="sub">Activity on your jobs</div>
  </div>
  <form method="post" action="{{ url_for('mark_all_read') }}">
    <button type="submit" class="btn-secondary btn-sm">Mark all read</button>
  </form>
</div>

<div class="card">
  {% for n in items %}
    <div class="comment" style="{% if not n.read %}background:rgba(124,92,255,.06);border-radius:8px;padding-left:.65rem;padding-right:.65rem;{% endif %}">
      <div class="avatar" style="background:{% if n.read %}#2a2a36{% else %}#7c5cff{% endif %};">{% if n.read %}·{% else %}!{% endif %}</div>
      <div class="body">
        <div class="when">{{ n.created_at|dt }}</div>
        <div class="text">{{ n.message }}</div>
        <form method="post" action="{{ url_for('mark_notification_read', nid=n.id) }}" style="margin-top:.5rem;">
          <button type="submit" class="btn-sm">Open</button>
        </form>
      </div>
    </div>
  {% else %}
    <div class="empty">
      <div class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </div>
      No notifications yet.
    </div>
  {% endfor %}
</div>
{% endblock %}
