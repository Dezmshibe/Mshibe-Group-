{% extends "base.html" %}
{% block content %}
<p style="margin:.25rem 0 1rem;"><a href="{{ url_for('request_detail', rid=req.id) }}" class="muted" style="font-size:.84rem;">&larr; Back to request</a></p>
<div class="card" style="max-width:620px;">
  <h2 style="margin-top:0;">Edit request #{{ req.id }}</h2>
  <form method="post">
    <div class="form-row"><label>Title</label><input type="text" name="title" value="{{ req.title }}" required></div>
    <div class="form-row"><label>Description</label><textarea name="description" required>{{ req.description }}</textarea></div>
    <div class="form-row"><label>Priority</label>
      <select name="priority">
        {% for p in PRIORITIES %}<option value="{{ p }}" {% if req.priority == p %}selected{% endif %}>{{ p }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-row"><label>Trade</label>
      <select name="trade_category">
        {% for t in TRADES %}<option value="{{ t }}" {% if req.trade_category == t %}selected{% endif %}>{{ t }}</option>{% endfor %}
      </select>
    </div>
    <button type="submit">Save changes</button>
  </form>
</div>
{% endblock %}
